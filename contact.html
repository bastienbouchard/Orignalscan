<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact – Orignal Scan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="data/logo.png">
  <link rel="apple-touch-icon" href="data/logo.png">
  <link rel="stylesheet" href="style.css?v=54">
</head>
<body>
<header>
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <a href="index.html" class="logo">
    <span class="logo-word">Orignal</span>
    <img src="data/logo.png" alt="Logo Orignal Scan">
    <span class="logo-word logo-scan">Scan</span>
  </a>
  <div class="header-spacer"></div>
  <nav id="nav">
    <a href="index.html" class="nav-link">Accueil</a>
    <a href="galerie.html" class="nav-link">Galerie</a>
    <a href="fonctionnalites.html" class="nav-link">Fonctionnalités</a>
    <a href="pour-qui.html" class="nav-link">Pour qui ?</a>
    <a href="telechargement.html" class="nav-link">Téléchargement</a>
    <a href="faq.html" class="nav-link">FAQ</a>
    <a href="contact.html" class="nav-link active">Contact</a>
    <a href="https://www.facebook.com/profile.php?id=61588826944605" target="_blank">📘 Facebook</a>
  </nav>
</header>


<main>
  <section class="contact-section">
    <h2 class="section-title">Nous contacter</h2>
    <p class="section-subtitle">Une question ? Une suggestion ? Écrivez-nous.</p>
    <form class="contact-form" action="https://formspree.io/f/mqeoejkv" method="POST">
      <input type="text" name="name" placeholder="Votre nom" required>
      <input type="email" name="email" placeholder="Votre courriel" required>
      <textarea name="message" rows="5" placeholder="Votre message" required></textarea>
      <button type="submit" class="btn-primary">Envoyer</button>
    </form>
  </section>
</main>

<footer>
  <div>
    © <span id="year"></span> Développement BB – Tous droits réservés.
    &nbsp;|&nbsp;
    <a href="mentions-legales.html">Mentions légales</a>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const hamburger = document.getElementById('hamburger');
  const nav = document.getElementById('nav');
  hamburger.addEventListener('click', () => nav.classList.toggle('open'));
  document.querySelectorAll('.nav-link').forEach(l => l.addEventListener('click', () => nav.classList.remove('open')));
</script>
</body>
</html>
