<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Orignal Scan – Application de chasse à l'orignal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Orignal Scan est une application conçue pour les chasseurs d'orignaux : cartes, observations, notes et planification.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1014;
      color: #f5f5f5;
    }
    header {
      background: linear-gradient(135deg, #1b2833, #243b4a);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2a33;
      position: relative;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .logo img {
      height: 200px;
      width: auto;
    }
    .logo-text span {
      color: #ffb347;
    }
    nav a {
      color: #d0d7de;
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    nav a:hover {
      color: #ffb347;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 40px;
      padding: 60px 8vw;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('data/forest-with-trees-close-up.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.08;
      z-index: 0;
      pointer-events: none;
    }
    .hero-text,
    .hero-visual {
      position: relative;
      z-index: 1;
    }
    .hero-text h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      margin-bottom: 10px;
    }
    .hero-text h1 span {
      color: #ffb347;
    }
    .hero-text p {
      font-size: 1rem;
      line-height: 1.6;
      color: #c5ced8;
      max-width: 540px;
    }
    .badges {
      margin: 20px 0 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .badge {
      border-radius: 999px;
      border: 1px solid #2b3a46;
      padding: 6px 14px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c5ced8;
      background: rgba(11, 16, 20, 0.7);
    }
    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-primary,
    .btn-secondary {
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #ffb347;
      color: #1b2833;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #ff9f1c;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 179, 71, 0.3);
    }
    .btn-secondary {
      background: transparent;
      color: #f5f5f5;
      border: 1px solid #2b3a46;
    }
    .btn-secondary:hover {
      border-color: #ffb347;
      color: #ffb347;
    }
    .hero-visual {
      background: radial-gradient(circle at top, #243b4a 0, #0b1014 55%);
      border-radius: 24px;
      border: 1px solid #1f2a33;
      padding: 24px;
      position: relative;
      min-height: 260px;
      overflow: hidden;
    }
    .tag {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(11, 16, 20, 0.8);
      border: 1px solid #2b3a46;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #ffb347;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .feature {
      background: #111821;
      border-radius: 16px;
      border: 1px solid #1f2a33;
      padding: 18px;
      transition: transform 0.3s, border-color 0.3s;
    }

    section {
      padding: 40px 8vw 60px;
      border-top: 1px solid #1f2a33;
    }

    footer {
      padding: 20px 8vw;
      border-top: 1px solid #1f2a33;
      font-size: 0.85rem;
      background: #05080b;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="data/logo.png">
    <div class="logo-text">Orignal <span>Scan</span></div>
  </div>
</header>

<main>

<section id="pour-qui">
  <h2 class="section-title">Pour qui est Orignal Scan ?</h2>

  <div class="features">
    <article class="feature">
      <h3>Chasseurs de la relève</h3>
      <p>...</p>
    </article>

    <article class="feature">
      <h3>Chasseurs expérimentés</h3>
      <p>...</p>
    </article>

    <article class="feature">
      <h3>Groupes de chasse</h3>
      <p>...</p>
    </article>

    <article class="feature">
      <h3>Sépaq ou pourvoiries</h3>
      <p>...</p>
    </article>
  </div>

</section>

</main>

</body>
</html>
